name: FacetWireVisionOSSpike
options:
  bundleIdPrefix: org.facetwire
  deploymentTarget:
    visionOS: "2.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"
targets:
  FacetWireVisionOSSpike:
    type: application
    platform: visionOS
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: FacetWire visionOS Spike
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UIApplicationPreferredDefaultSceneSessionRole: UIWindowSceneSessionRoleApplication
          UISceneConfigurations: {}
    sources:
      - path: Sources
      - path: ../../playground_ui/native/src/facetwire_ui_spike.c
      - path: ../../../plugins/flow_layout/src/plugin.c
      - path: ../../../plugins/flow_layout/src/flow_virtual_pages.c
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.facetwire.visionos-spike
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(PROJECT_DIR)/../../playground_ui/native/include
          - $(PROJECT_DIR)/../../../examples/placeholder_demo/native/include
          - $(PROJECT_DIR)/../../../include
        SWIFT_OBJC_BRIDGING_HEADER: $(PROJECT_DIR)/Sources/FacetWireVisionOSSpike-Bridging-Header.h
        GCC_PREPROCESSOR_DEFINITIONS:
          - $(inherited)
          - FWUI_BUILDING_LIBRARY=1
  FacetWireVisionOSSpikeTests:
    type: bundle.unit-test
    platform: visionOS
    sources:
      - path: Tests
    dependencies:
      - target: FacetWireVisionOSSpike
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.facetwire.visionos-spike.tests
        GENERATE_INFOPLIST_FILE: YES
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(PROJECT_DIR)/../../playground_ui/native/include
          - $(PROJECT_DIR)/../../../include
schemes:
  FacetWireVisionOSSpike:
    build:
      targets:
        FacetWireVisionOSSpike: all
        FacetWireVisionOSSpikeTests: [test]
    test:
      targets:
        - FacetWireVisionOSSpikeTests
